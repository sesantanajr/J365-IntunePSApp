name: Update the application database

# Rebuilds catalog.json.gz from the public repository microsoft/winget-pkgs (MIT) every day and publishes it
# to the "catalog" release, where the application downloads it from.

on:
  schedule:
    - cron: '17 4 * * *'   # every day at 04:17 UTC
  workflow_dispatch:
    inputs:
      allow_smaller:
        description: 'Publish even when the new database has more than 10% fewer applications than the one in use'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths: [ 'catalog/curated.json', 'tools/CatalogBuilder/**' ]

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Build catalog.json.gz from winget-pkgs
    runs-on: ubuntu-latest
    # A stalled download of the winget-pkgs tarball would otherwise run for 6 hours and hold the queue.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the database
        run: dotnet run --project tools/CatalogBuilder -c Release -- --out out --curated catalog/curated.json

      - name: Publish to the "catalog" release
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_SMALLER: ${{ inputs.allow_smaller }}
        run: |
          COUNT=$(jq .count out/catalog-meta.json)
          GEN=$(jq -r .generated out/catalog-meta.json)
          COMMIT=$(jq -r .commit out/catalog-meta.json)
          # Safety net: never replace the database with a suspiciously small one. Every copy of the application takes
          # the new one within a day, so a parsing problem upstream must not reach them: an absolute floor, and no more
          # than 10% fewer applications than the database in use (Run workflow with allow_smaller overrides it).
          if [ "$COUNT" -lt 5000 ]; then echo "Only $COUNT applications: refusing to publish."; exit 1; fi
          if [ "$ALLOW_SMALLER" != "true" ] && gh release download catalog -p catalog-meta.json -D prev 2>/dev/null; then
            PREV=$(jq .count prev/catalog-meta.json)
            if [ -n "$PREV" ] && [ "$PREV" -gt 0 ] && [ $((COUNT * 10)) -lt $((PREV * 9)) ]; then
              echo "Only $COUNT applications against $PREV in the release in use: refusing to publish."; exit 1
            fi
          fi
          if ! gh release view catalog >/dev/null 2>&1; then
            gh release create catalog --title "Application database" --notes "Generated automatically." --latest=false
          fi
          # The metadata file goes last: clients read it first and only download the database when it changed.
          gh release upload catalog out/catalog.json.gz --clobber
          gh release upload catalog out/catalog-meta.json --clobber
          gh release edit catalog --latest=false --title "Application database" --notes "Database of **J365 IntunePSApp**, rebuilt automatically every day from [microsoft/winget-pkgs](https://github.com/microsoft/winget-pkgs) (MIT licence) plus the curated knowledge in \`catalog/curated.json\`.

          - **Applications:** $COUNT
          - **Generated:** $GEN (UTC)
          - **winget-pkgs commit:** \`${COMMIT:0:12}\`

          The application downloads this file by itself. Offline use: Settings > Application database > Import file.

          ---

          Banco de dados do **J365 IntunePSApp**, recriado automaticamente todos os dias a partir do microsoft/winget-pkgs (licença MIT) com a curadoria do Jornada 365. O aplicativo baixa este arquivo sozinho. Uso offline: Configurações > Banco de dados de aplicativos > Importar arquivo."

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        # Re-enabling the workflow through the API resets that countdown.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/catalog.yml/enable" || echo "Keep-alive skipped."
