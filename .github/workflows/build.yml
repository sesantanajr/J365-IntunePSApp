name: Build and release

# Every push and pull request: unit tests + portable build.
# New versions pushed to main (or explicit v* tags): publish only after all checks, with
#   - the portable application (win-x64, single executable), code-signed when a signing identity is configured,
#   - the source package of that exact commit,
#   - SHA256SUMS.txt and a signed build provenance attestation (gh attestation verify).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'catalog/curated.json', '**.md', 'docs/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build (win-x64)
    runs-on: windows-latest
    env:
      # Code signing (docs/SIGNING.md, CODE_SIGNING_POLICY.md). Repository variables; all empty = unsigned build.
      # SignPath (free for open-source projects through SignPath Foundation):
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_EXE_CONFIGURATION: ${{ vars.SIGNPATH_EXE_CONFIGURATION }}
      SIGNPATH_SCRIPTS_CONFIGURATION: ${{ vars.SIGNPATH_SCRIPTS_CONFIGURATION }}
      # Azure Artifact Signing (formerly Trusted Signing):
      SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version and signing mode
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $ver = (Select-Xml -Path src/IntunePSApp/IntunePSApp.csproj -XPath '//Version').Node.InnerText.Trim() }
          # Signing never runs for pull requests (they have no access to the secrets).
          $mode = 'none'
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            if ($env:SIGNPATH_ORGANIZATION_ID) { $mode = 'signpath' } elseif ($env:SIGNING_ACCOUNT) { $mode = 'azure' }
          }
          $scripts = ($mode -eq 'azure') -or ($mode -eq 'signpath' -and [bool]$env:SIGNPATH_SCRIPTS_CONFIGURATION)
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_SCRIPTS=$($scripts.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $ver - signing: $mode (scripts: $scripts)"

      - name: Unit tests
        run: dotnet test tests/IntunePSApp.Tests -c Release --logger "console;verbosity=normal"

      - name: Build the database generator
        run: dotnet build tools/CatalogBuilder -c Release

      - name: Render interface smoke checks
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:J365_INTUNEPSAPP_DATA = Join-Path $env:RUNNER_TEMP 'j365-visual-data'
          $demo = Join-Path $env:RUNNER_TEMP 'j365-visual-project.json'
          @{ AppName = 'Aplicativo corporativo'; AppVersion = '3.2.0'; AppVendor = 'Sua organização'; CompanyName = 'Jornada 365'; Description = 'Distribuição gerenciada de aplicativos para sua organização.'; UninstallPattern = 'Corporate App*'; DetectionNamePattern = 'Corporate App*'; AccentColor = '#2563EB'; AppArch = 'x64' } | ConvertTo-Json | Set-Content $demo -Encoding utf8
          foreach ($mode in @(@{ Theme = 'dark'; Size = '1440x900'; Language = 'pt-BR'; Folder = 'dark' }, @{ Theme = 'light'; Size = '1024x768'; Language = 'pt-BR'; Folder = 'light' }, @{ Theme = 'dark'; Size = '1440x900'; Language = 'en'; Folder = 'en-dark' }, @{ Theme = 'light'; Size = '1024x768'; Language = 'en'; Folder = 'en-light' })) {
            $folder = Join-Path $env:GITHUB_WORKSPACE "visual-checks/$($mode.Folder)"
            $args = @('--snapshot', "`"$folder`"", '--snapshot-project', "`"$demo`"", '--theme', $mode.Theme, '--lang', $mode.Language, '--snapshot-size', $mode.Size, '--no-update', '--no-setup', '--snapshot-state-checks')
            $process = Start-Process src/IntunePSApp/bin/Release/net10.0-windows/J365.IntunePSApp.exe -ArgumentList $args -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Interface rendering timed out.' }
            if ($process.ExitCode -ne 0) { throw "Interface rendering failed: $($process.ExitCode)" }
            if (Test-Path "$folder/error.txt") { throw (Get-Content "$folder/error.txt" -Raw) }
            if (-not (Test-Path "$folder/workspace-checks.txt")) { throw 'Workspace regression checks did not complete.' }
            if (-not (Test-Path "$folder/03-editor-2.png")) { throw 'The editor capture is missing.' }
            if (-not (Test-Path "$folder/02-batch.png")) { throw 'The batch window capture is missing.' }
            if ((Get-Content "$folder/editor-state.txt" -Raw).Trim() -ne 'unsaved=False') { throw 'Navigating changed the project.' }
          }

      - name: Upload interface captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-captures
          path: visual-checks/
          if-no-files-found: error

      # ------------------------------------------------------------------ companion scripts
      # Publish-ToIntune.ps1 and Sandbox-Test.ps1 are embedded in the executable and written into every package, so
      # they are signed before the build: signed, they keep full PowerShell where Windows App Control (or Smart App
      # Control) restricts unsigned scripts.
      - name: Upload the scripts to sign (SignPath)
        id: unsigned-scripts
        if: env.SIGN_MODE == 'signpath' && env.SIGN_SCRIPTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-scripts
          path: |
            src/IntunePSApp/Resources/Publish-ToIntune.ps1
            src/IntunePSApp/Resources/Sandbox-Test.ps1
          if-no-files-found: error

      - name: Sign the scripts (SignPath)
        if: env.SIGN_MODE == 'signpath' && env.SIGN_SCRIPTS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_SCRIPTS_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-scripts.outputs.artifact-id }}
          wait-for-completion: true
          # Every request of the open-source programme is approved by hand in SignPath: one hour to do it.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-scripts

      - name: Sign the scripts (Azure Artifact Signing)
        if: env.SIGN_MODE == 'azure'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force -AllowClobber
          New-Item -ItemType Directory signed-scripts | Out-Null
          Copy-Item src/IntunePSApp/Resources/Publish-ToIntune.ps1, src/IntunePSApp/Resources/Sandbox-Test.ps1 signed-scripts/
          Invoke-TrustedSigning -Endpoint $env:SIGNING_ENDPOINT -CodeSigningAccountName $env:SIGNING_ACCOUNT -CertificateProfileName $env:SIGNING_PROFILE `
            -Files ((Get-ChildItem signed-scripts/*.ps1).FullName -join ',') -FileDigest SHA256 -TimestampRfc3161 'http://timestamp.acs.microsoft.com' -TimestampDigest SHA256

      - name: Embed the signed scripts
        if: env.SIGN_SCRIPTS == 'true'
        shell: pwsh
        run: |
          foreach ($name in 'Publish-ToIntune.ps1', 'Sandbox-Test.ps1') {
            $file = Get-ChildItem signed-scripts -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { throw "The signed $name is missing." }
            ./tools/Assert-Signature.ps1 -Path $file.FullName
            Copy-Item $file.FullName "src/IntunePSApp/Resources/$name" -Force
          }

      - name: Publish the portable application
        shell: pwsh
        run: dotnet publish src/IntunePSApp -c Release -r win-x64 -o publish -p:Version=$env:VERSION -p:ContinuousIntegrationBuild=true

      # ------------------------------------------------------------------ executable
      # Signed before it is zipped, hashed and attested.
      - name: Upload the executable to sign (SignPath)
        id: unsigned
        if: env.SIGN_MODE == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executable
          path: publish/J365.IntunePSApp.exe
          if-no-files-found: error

      - name: Sign the executable (SignPath)
        if: env.SIGN_MODE == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_EXE_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed executable (SignPath)
        if: env.SIGN_MODE == 'signpath'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter J365.IntunePSApp.exe | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return J365.IntunePSApp.exe.' }
          Copy-Item $signed.FullName publish/J365.IntunePSApp.exe -Force

      - name: Sign the executable (Azure Artifact Signing)
        if: env.SIGN_MODE == 'azure'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force -AllowClobber
          Invoke-TrustedSigning -Endpoint $env:SIGNING_ENDPOINT -CodeSigningAccountName $env:SIGNING_ACCOUNT -CertificateProfileName $env:SIGNING_PROFILE `
            -Files (Resolve-Path publish/J365.IntunePSApp.exe).Path -FileDigest SHA256 -TimestampRfc3161 'http://timestamp.acs.microsoft.com' -TimestampDigest SHA256

      # A signing that was configured but did not produce a valid, timestamped signature stops the release.
      - name: Check the signature of the executable
        if: env.SIGN_MODE != 'none'
        shell: pwsh
        run: ./tools/Assert-Signature.ps1 -Path publish/J365.IntunePSApp.exe

      - name: Package the release files
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, NOTICE.md, THIRD-PARTY-NOTICES.md, CHANGELOG.md, SECURITY.md, CODE_SIGNING_POLICY.md publish/
          New-Item -ItemType Directory dist | Out-Null
          $app = "dist/J365-IntunePSApp-$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $app
          # Source package: exactly the files of this commit (to audit, build or fork).
          $src = "dist/J365-IntunePSApp-$env:VERSION-source.zip"
          git archive --format=zip --prefix="J365-IntunePSApp-$env:VERSION/" -o $src HEAD
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Smoke test of the published executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/J365.IntunePSApp.exe -ArgumentList '--version' -PassThru -RedirectStandardOutput version.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "The published executable did not exit." }
          $out = (Get-Content version.txt -Raw).Trim()
          Write-Host "Exit code $($p.ExitCode), version '$out'"
          if ($p.ExitCode -ne 0 -or $out -ne $env:VERSION) { throw "The published executable did not report version $env:VERSION." }
          $sig = Get-AuthenticodeSignature -FilePath publish/J365.IntunePSApp.exe
          Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: J365-IntunePSApp-${{ env.VERSION }}
          path: dist/*

      - name: Create the release
        # A push to main, a v* tag, or "Run workflow" on main (to publish a version whose run was skipped).
        if: startsWith(github.ref, 'refs/tags/v') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Release version must be major.minor.patch.' }
          $projectVersion = (Select-Xml -Path src/IntunePSApp/IntunePSApp.csproj -XPath '//Version').Node.InnerText.Trim()
          if ($projectVersion -ne $env:VERSION) { throw 'Tag and project versions must match.' }
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          if ($releases.tagName -contains $tag) { Write-Host "$tag already exists; leaving it unchanged."; exit 0 }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $head = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq '.sha'
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify main.' }
            if ($head -ne $env:GITHUB_SHA) {
              # A newer commit that only changes documentation (paths-ignore) starts no build of its own: this run
              # still publishes, or the version would never be released. Any other newer commit publishes itself.
              $files = @(gh api "repos/$env:GITHUB_REPOSITORY/compare/$env:GITHUB_SHA...$head" --jq '.files[].filename')
              if ($LASTEXITCODE -ne 0) { throw 'Could not compare with main.' }
              if ($files | Where-Object { $_ -notmatch '\.md$|^docs/|^catalog/curated\.json$' }) { Write-Host 'A newer main commit exists and will publish; this run will not.'; exit 0 }
              Write-Host 'Newer main commits only change documentation: publishing this version.'
            }
            $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
            if ($refs.ref -contains "refs/tags/$tag") { throw 'Tag already exists without a release. Run its tag build explicitly.' }
          }
          $notes = (Get-Content .github/RELEASE_NOTES.md -Raw).TrimEnd()
          $sig = Get-AuthenticodeSignature -FilePath publish/J365.IntunePSApp.exe
          $notes += "`n`n---`n"
          if ($sig.Status -eq 'Valid') {
            $signer = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            $notes += "**Code-signed** by *$signer* (check: right-click ``J365.IntunePSApp.exe`` > Properties > Digital Signatures, or ``Get-AuthenticodeSignature``). "
          }
          else { $notes += "This release is **not code-signed** yet ([why and what to do](https://github.com/$env:GITHUB_REPOSITORY/blob/main/docs/SIGNING.md)). " }
          $notes += "[Code signing policy](https://github.com/$env:GITHUB_REPOSITORY/blob/main/CODE_SIGNING_POLICY.md).`n"
          # The SignPath Foundation programme asks every release it signs to say so.
          if ($env:SIGN_MODE -eq 'signpath') { $notes += "`nFree code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).`n" }
          Set-Content release-notes.md $notes -Encoding utf8
          gh release create $tag (Get-ChildItem dist/*).FullName --target $env:GITHUB_SHA --title "J365 IntunePSApp $env:VERSION" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
