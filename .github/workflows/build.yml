name: Build and release

# Every push and pull request: unit tests + portable build.
# Tags "v*": the same build is published as a GitHub release with
#   - the portable application (win-x64, single executable),
#   - the source package of that exact commit,
#   - SHA256SUMS.txt and a signed build provenance attestation (gh attestation verify).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'catalog/curated.json', '**.md', 'docs/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Test and build (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $ver = ([xml](Get-Content src/IntunePSApp/IntunePSApp.csproj)).Project.PropertyGroup[0].Version }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $ver"

      - name: Unit tests
        run: dotnet test tests/IntunePSApp.Tests -c Release --logger "console;verbosity=normal"

      - name: Build the database generator
        run: dotnet build tools/CatalogBuilder -c Release

      - name: Publish the portable application and the source package
        shell: pwsh
        run: |
          dotnet publish src/IntunePSApp -c Release -r win-x64 -o publish -p:Version=$env:VERSION -p:ContinuousIntegrationBuild=true
          Copy-Item README.md, LICENSE, NOTICE.md, THIRD-PARTY-NOTICES.md, CHANGELOG.md publish/
          New-Item -ItemType Directory dist | Out-Null
          $app = "dist/J365-IntunePSApp-$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $app
          # Source package: exactly the files of this commit (to audit, build or fork).
          $src = "dist/J365-IntunePSApp-$env:VERSION-source.zip"
          git archive --format=zip --prefix="J365-IntunePSApp-$env:VERSION/" -o $src HEAD
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Smoke test of the published executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/J365.IntunePSApp.exe -ArgumentList '--version' -PassThru -RedirectStandardOutput version.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "The published executable did not exit." }
          $out = (Get-Content version.txt -Raw).Trim()
          Write-Host "Exit code $($p.ExitCode), version '$out'"
          if ($p.ExitCode -ne 0 -or $out -ne $env:VERSION) { throw "The published executable did not report version $env:VERSION." }

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: J365-IntunePSApp-${{ env.VERSION }}
          path: dist/*

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --title "J365 IntunePSApp $env:VERSION" --notes-file .github/RELEASE_NOTES.md --latest
