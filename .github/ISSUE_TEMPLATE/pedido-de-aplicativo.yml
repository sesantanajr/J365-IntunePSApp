name: Pedido ou correção de aplicativo
description: Sugira a curadoria de um aplicativo ou corrija dados do banco (processos, desinstalação, detecção).
title: "[App] "
labels: [ "catálogo" ]
body:
  - type: input
    id: app
    attributes:
      label: Aplicativo e ID do winget
      placeholder: "Ex.: Notepad++ (Notepad++.Notepad++)"
    validations:
      required: true
  - type: textarea
    id: dados
    attributes:
      label: O que precisa ser ajustado?
      description: Processos a fechar, nome em "Aplicativos instalados", parâmetros de desinstalação, detecção, observações...
    validations:
      required: true
  - type: textarea
    id: teste
    attributes:
      label: Como você testou?
      description: Versão do app, Windows, modo (Sistema/Usuário), trechos relevantes do log do PSADT.
