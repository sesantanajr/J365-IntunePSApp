name: Bug report / Relatar um problema
description: Something did not work as expected. / Algo não funcionou como esperado.
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: "English or Portuguese are both welcome. / Pode escrever em português ou inglês."
  - type: textarea
    id: what
    attributes:
      label: What happened? / O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Como reproduzir
      placeholder: "1. Opened the catalog... 2. Picked the app... 3. Clicked Generate..."
  - type: input
    id: version
    attributes:
      label: J365 IntunePSApp version and Windows version / Versão do aplicativo e do Windows
      placeholder: "3.0.1 - Windows 11 25H2 - portable / installed"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Application log (Settings > General > Logs, or %LOCALAPPDATA%\\J365\\IntunePSApp\\logs\\app-YYYYMMDD.log), build.log of the package and/or the PSAppDeployToolkit log. Remove sensitive data first. / Log do aplicativo (Configurações > Geral > Logs, ou %LOCALAPPDATA%\\J365\\IntunePSApp\\logs\\app-AAAAMMDD.log), build.log do pacote e/ou log do PSAppDeployToolkit. Remova dados sensíveis antes."
      render: text
