name: Relatar um problema
description: Algo não funcionou como esperado.
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abri o catálogo... 2. Escolhi o app... 3. Cliquei em Gerar..."
  - type: input
    id: versao
    attributes:
      label: Versão do J365 IntunePSApp e do Windows
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Conteúdo de geracao.log e/ou do log do PSADT. Remova dados sensíveis.
      render: text
